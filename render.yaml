services:
  - type: web
    name: qc-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Set this in the Render dashboard (Environment tab). Never commit the key.
      - key: GROQ_API_KEY
        sync: false
      - key: QC_MODEL
        value: "openai/gpt-oss-120b"
